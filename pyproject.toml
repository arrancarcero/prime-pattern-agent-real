[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prime-pattern-agent-real"
version = "0.1.0"
description = "Real-primes-only, pre-registered version of the Prime-Pattern Agent: every yardstick is a theorem, a formula or real primes."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ppa-real = "ppa_real.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
